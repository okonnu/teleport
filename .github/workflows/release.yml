name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/build-release.sh "$version"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "BetterDisplayHotkeys $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            dist/BetterDisplayHotkeys-macOS.zip \
            dist/BetterDisplayHotkeys-macOS.zip.sha256 \
            --clobber
